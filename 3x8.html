<html>
<head>
    <title>
        Exercise: buttons on CSS
    </title>
    <style>
        a.btn {
            text-decoration: none;
            color: crimson;
            font-family: Arial, sans-serif;
            font-weight: bold;
            padding: 12px 24px;
            margin: 8px;
            border-radius: 7px;
            transition:  all 0.4s ease;
            display: inline-block;
            cursor: pointer;
        }

        .btn-discount {
            background-color: #3b82f6;
        }
        .btn-discount:hover {
            background-color: lightcoral;
        }
        .btn-contact:hover {
            background-color: saddlebrown;
            box-shadow: 0 7px 14px rgba(0,0,0,0.25);
        }
        .btn-more:hover {
            background-color: aqua;
        }
        .btn-mare {
            background-color: green;
            box-shadow: 0 7px 12px rgba(0,0,0,0.25);
        }
        .btn-mare:hover {
            background-color: crimson;
        }
    </style>
</head>
<body>
<a href="#" class="btn btn-discount">WERT</a>
<a href="#" class="btn btn-more">RTYG</a>
<a href="#" class="btn btn-contact">FGHY</a>
<a href="#" class="btn btn-mare">OPP</a>
</body>
</html>
