<body>
<script>
    function Degree() {
        let a = +prompt("Введите число: ")
        let b = +prompt("Ведите степень: ")

        let val = 1
        let i = 0

        while (i < b) {
            val *= a
            i++
        }

        alert("Результат: " + val)
     }
     Degree()
</script>
